<!DOCTYPE html>
<html>
<head>
  <title>AVL Tree Visualization</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    #tree-container {
      margin-top: 20px;
      border: 1px solid #ccc;
      padding: 20px;
    }
  </style>
</head>
<body>
  <button id="tree">Click to Visualize AVL Tree</button>
  <div id="tree-container"></div>

  <script>
    document.getElementById("tree").addEventListener("click", async function () {
      const response = await fetch("http://localhost:8080/treeview");
      const data = await response.json();
      drawTree(data);
    });

    function drawTree(rootNode) {
      document.getElementById("tree-container").innerHTML = ""; // Clear previous SVG

      const width = 800, height = 400;
      const treeLayout = d3.tree().size([width, height]);

      const root = d3.hierarchy(rootNode, d => [d.left, d.right].filter(Boolean));
      treeLayout(root);

      const svg = d3.select("#tree-container")
        .append("svg")
        .attr("width", width + 100)
        .attr("height", height + 100)
        .append("g")
        .attr("transform", "translate(50,50)");

      svg.selectAll("line")
        .data(root.links())
        .enter()
        .append("line")
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y)
        .attr("stroke", "#ccc");

      svg.selectAll("circle")
        .data(root.descendants())
        .enter()
        .append("circle")
        .attr("cx", d => d.x)
        .attr("cy", d => d.y)
        .attr("r", 20)
        .attr("fill", "#69b3a2");

      svg.selectAll("text")
        .data(root.descendants())
        .enter()
        .append("text")
        .attr("x", d => d.x)
        .attr("y", d => d.y - 30)
        .attr("text-anchor", "middle")
        .text(d => d.data.studentId || "N/A");
    }
  </script>
</body>
</html>
