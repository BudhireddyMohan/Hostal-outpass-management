<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #ffffff);
      margin: 0;
      padding: 0;
    }

    .dashboard {
      width: 85%;
      max-width: 950px;
      background-color: #ffffff;
      margin: 40px auto;
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 15px;
    }

    .header h2 {
      margin: 0;
      font-size: 28px;
      color: #007bff;
    }

    .header .logout-btn {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .header .logout-btn:hover {
      background-color: #c82333;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      font-size: 18px;
      margin: 12px 0;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .btn:hover {
      background-color: #0056b3;
    }

    .section {
      margin-top: 30px;
    }

    .stats h3, .quick-actions h3 {
      color: #333;
      margin-bottom: 10px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 5px;
    }

    .stats p {
      margin: 6px 0;
      font-size: 16px;
      color: #555;
    }

    .quick-actions button {
      margin: 8px 10px 8px 0;
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background-color: #28a745;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    .quick-actions button.reject {
      background-color: #dc3545;
    }

    .quick-actions button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="header">
      <h2 style="color: #333;">Admin Dashboard</h2>
      <button class="logout-btn" id="logout">Logout</button>
      <script>
        document.getElementById("logout").addEventListener("click",function(){
          window.location.href = "http://localhost:8080/logout-to-loginpage"
        })
      </script>
    </div>

    <button class="btn" id="addstudent">Add Student</button>
<script>
  document.getElementById("addstudent").addEventListener("click", function () {
   window.location.href = "http://localhost:8080/add-student-page"  
  });
</script>

    <button class="btn" id="managastudentspgae">Manage Students</button>
    <script>
  document.getElementById("managastudentspgae").addEventListener("click", function () {
   window.location.href = "http://localhost:8080/managastudentspgae"  
  });
</script>
    <button class="btn" id="ViewOutpassespage">View Outpasses</button>
    <script>
  document.getElementById("ViewOutpassespage").addEventListener("click", function () {
    window.location.href = "http://localhost:8080/PendingOutpassesRequests";  
  });
</script>
    <button class="btn" id="viewtree">AVL Tree Visualizer</button>
  <script>
    document.getElementById("viewtree").addEventListener("click",function(){
    window.location.href = "http://localhost:8080/viewtreepage";  
    })
  </script>
   
<div class="section stats">
  <h3>📊 Stats:</h3>
  <p>🕐 Pending: <strong th:text="${pendingCount}">0</strong></p>
<p>✅ Approved Today: <strong th:text="${approvedToday}">0</strong></p>
</div>

    <div class="section quick-actions">
      <h3>⚡ Quick Actions</h3>
      <button id="Approve-all">Approve All</button>
      <button id="Reject-all" class="reject">Reject All</button>
   <script>
  document.getElementById("Approve-all").addEventListener("click", async function () {
    const response = await fetch("http://localhost:8080/Approve-all-passes", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ status: "accepted" })
    });

    const result = await response.text();
    if (response.ok) {
      alert("All requests have been approved!");
      location.reload();
    }
  });

  document.getElementById("Reject-all").addEventListener("click", async function () {
    const response = await fetch("http://localhost:8080/Approve-all-passes", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ status: "rejected" }) 
    });

    const result = await response.text();
    if (response.ok) {
      alert("All requests have been rejected!");
      location.reload();
    }
  });
</script>

    </div>
  </div>
</body>
</html>
