<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Add Student</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f7fafc;
      padding: 40px;
    }
    h2 {
      color: #2b6cb0;
      margin-bottom: 20px;
    }
    form {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 600px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
    }
    .submit-btn {
      background-color: #2b6cb0;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .submit-btn:hover {
      background-color: #1a4d8f;
    }
    .success-msg {
      margin-top: 20px;
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>
<center>
  <h2>Admin - Add New Student</h2>

  <form id="studentForm">
    <label>Username</label>
    <input type="text" id="username" required>

    <label>Password</label>
    <input type="password" id="password" required>

    <label>Student ID</label>
    <input type="number" id="studentId" required>

    <label>Student Name</label>
    <input type="text" id="student_Name" required>

    <label>Branch</label>
    <input type="text" id="branch" required>

    <label>Year</label>
    <input type="number" id="year" required>

    <label>Hostel Name</label>
    <input type="text" id="hostal_Name" required>

    <label>Room Number</label>
    <input type="text" id="room_num" required>

    <label>Phone Number</label>
    <input type="text" id="phonenumber" required>

    <button type="submit" class="submit-btn">Add Student</button>

    <div id="message" class="success-msg"></div>
  </form>
</center>
  <script>
    document.getElementById("studentForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const studentData = {
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
        student_Information: {
          studentId: parseInt(document.getElementById("studentId").value),
          student_Name: document.getElementById("student_Name").value,
          branch: document.getElementById("branch").value,
          year: parseInt(document.getElementById("year").value),
          hostal_Name: document.getElementById("hostal_Name").value,
          room_num: document.getElementById("room_num").value,
          phonenumber: document.getElementById("phonenumber").value,
          username: document.getElementById("username").value, 
          password: document.getElementById("password").value
        },
        OutpassHistoryStack: [] // empty when registering
      };

      const response = await fetch("http://localhost:8080/addstudent", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(studentData)
      });

      if (response.ok) {
        document.getElementById("message").textContent = "✅ Student added successfully!";
        document.getElementById("studentForm").reset();
      } else {
        document.getElementById("message").textContent = "❌ Failed to add student.";
      }
    });
  </script>

</body>
</html>
