<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Students</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 20px;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    .section {
      background: white;
      padding: 20px;
      margin-bottom: 30px;
      border-radius: 8px;
      box-shadow: 0 0 5px #ccc;
    }
    .section h3 {
      margin-bottom: 10px;
    }
    input[type="text"] {
      padding: 8px;
      width: 250px;
      margin-right: 10px;
    }
    button {
      padding: 8px 16px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .details, .history {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      background: #f9f9f9;
    }
    .details p, .history li {
      margin: 4px 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ccc;
    }
    th {
      background: #007bff;
      color: white;
    }
  </style>
</head>
<body>

<h2>Manage Students</h2>

<div class="section">
  <h3>🔍 Search Student by ID/User Name</h3>
  <input type="text" id="searchId" placeholder="Enter Student ID">
  <button onclick="searchStudent()">Search</button>

  <div id="studentDetails" class="details" style="display:none;"></div>
</div>


<script>
  async function searchStudent() {
    const id = document.getElementById("searchId").value.trim();
    const container = document.getElementById("studentDetails");

    if (!id) {
      container.style.display = "block";
      container.innerHTML = "<p>❌ Please enter a student ID.</p>";
      return;
    }

    try {
      const response = await fetch("http://localhost:8080/searchstudentdetails", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ id })
      });

      const data = await response.json();

      if (!data || Object.keys(data).length === 0) {
        container.style.display = "block";
        container.innerHTML = "<p>❌ Student not found.</p>";
        return;
      }

      let html = `
        <p><strong>Name:</strong> ${data.studentname}</p>
        <p><strong>Branch:</strong> ${data.branch}</p>
        <p><strong>Year:</strong> ${data.year}rd</p>
        <p><strong>Hostel:</strong> ${data.hostalname}</p>
        <p><strong>Room:</strong> ${data.roomnumber}</p>
        <p><strong>Phone:</strong> ${data.phonenumber}</p>
        <p><strong>Username:</strong> ${id}</p>
        <p><strong>Password:</strong> ${data.password}</p>
      `;

      container.innerHTML = html;
      container.style.display = "block";
    } catch (error) {
      container.innerHTML = "<p>⚠️ Error fetching student details.</p>";
      container.style.display = "block";
      console.error(error);
    }
  }
</script>


</body>
</html>
