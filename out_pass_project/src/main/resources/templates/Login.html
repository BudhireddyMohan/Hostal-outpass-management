<!DOCTYPE html>
<html>
<head>
  <title>Hostel Outpass System</title>
  <style>
    body {
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }
    .container {
      width: 350px;
      background-color: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px #aaa;
      margin: 100px auto;
      text-align: center;
    }
    .container h2 {
      margin-bottom: 20px;
    }
    .container input {
      width: 90%;
      padding: 8px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .btn {
      padding: 10px 20px;
      margin: 15px 5px 5px 5px;
      border: none;
      border-radius: 5px;
      background-color: #2b6cb0;
      color: white;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #1a4d8f;
    }
    .forgot {
      background-color: #aaa;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>HOSTEL OUTPASS SYSTEM</h2>
    <hr>
    <form>
      <label>Username:</label><br>
      <input type="text" id="username" placeholder="Enter Username" required><br>

      <label>Password:</label><br>
      <input type="password" id="password" placeholder="Enter Password" required><br>

      <button type="button" class="btn" id="submit">LOGIN</button>
      <button class="btn forgot" type="button">Forgot ?</button>
    </form>
  </div>
</body>
<!-------------------------------script for login----------------------------------------------------------->
<script>
document.getElementById("submit").addEventListener("click", async function (event) {
  event.preventDefault();

  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  const response = await fetch("http://localhost:8080/login", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ username, password })
  });

  const data = await response.json();
  console.log(data);

  if (response.ok) {
    if (data.redirectingpage) {

//-----------------------------Admin login code------------------------------------------//
      if(data.Admin=="ok"){
       window.location.href = "http://localhost:8080/" + data.redirectingpage;

      }

      //------------------------------student login code-------------------------------------//
   if (response.ok && data.redirectingpage) {
  const url = new URL("http://localhost:8080" + data.redirectingpage);
  url.searchParams.append("id", data.StudentNode);
  url.searchParams.append("name", data.username);
  window.location.href = url.toString();
}
     console.log("data="+data);
    } else {
      console.log("Redirect path missing");
    }
  }
});

</script>
</html>
