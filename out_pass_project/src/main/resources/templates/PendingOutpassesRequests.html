<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Pending Outpasses</title>
  <style>
    .request-card {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 15px;
      margin: 10px;
      background-color: #f9f9f9;
    }
    .request-card button {
      margin: 5px;
      padding: 6px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .approve-btn { background-color: #4CAF50; color: white; }
    .reject-btn { background-color: #f44336; color: white; }
  </style>
</head>
<center>
<body>
  <h2>Pending Requests</h2>
<div th:if="${#lists.isEmpty(pendingOutpasses)}">
  <p>No pending requests available.</p>
</div>

<div th:each="entry, iterStat : ${pendingOutpasses}" class="request-card">
  <p><strong th:text="'#' + ${iterStat.index + 1} + ' ' + ${entry.studentname} + ' (' + ${entry.branch} + ')'"></strong></p>
  <p th:text="'ID: ' + ${entry.studentid}"></p>
  <p th:text="'Date & Time: ' + ${entry.outpassdate} + ' ' + ${entry.outpasstime}"></p>
  <p th:text="'Reason: ' + ${entry.reason}"></p>

<button class="approve-btn"
        th:attr="data-studentid=${entry.studentid}, data-mongodbid=${entry.mongodbid}">APPROVE</button>
<button class="reject-btn"
        th:attr="data-studentid=${entry.studentid}, data-mongodbid=${entry.mongodbid}">REJECT</button>

</div>
<script>
  // Function to handle both approve and reject buttons
  async function handleStatusUpdate(button, status) {
    const studentid = button.getAttribute("data-studentid");
    const mongodbid = button.getAttribute("data-mongodbid"); // ✅ This line was missing
    const card = button.closest(".request-card");

    const response = await fetch("http://localhost:8080/accept-reject-outpasses", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ status, studentid, mongodbid })
    });

    const result = await response.text();
    console.log("Response:", result);

    // ✅ If status update was successful, remove the card from the DOM
    if (response.ok && result.includes("Status updated")) {
      card.remove();
    }
  }

  // Attach to approve buttons
  document.querySelectorAll(".approve-btn").forEach(button => {
    button.addEventListener("click", () => handleStatusUpdate(button, "accepted"));
  });

  // Attach to reject buttons
  document.querySelectorAll(".reject-btn").forEach(button => {
    button.addEventListener("click", () => handleStatusUpdate(button, "rejected"));
  });
</script>



</body>
</center>
</html>
